<title>Есет батыр жолы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Есет батыр бастаған ұлт-азаттық көтеріліс (1847–1858): оқу ойыны. 9 «В» сынып жобасы.">
<meta property="og:title" content="Есет батыр жолы">
<meta property="og:description" content="Есет батыр бастаған ұлт-азаттық көтеріліс (1847–1858): ойнап үйрен.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one fixed night-steppe canvas whose time of day follows the chapters; a sticky top bar (nav + game meters); each view is a felt "сырмақ" panel that unrolls onto the steppe; the defense mode is a full-screen slide stage. */
:root{
  color-scheme: dark;
  --night:#0b1330;
  --felt:#18224e;
  --felt-2:#1f2a5c;
  --saffron:#e8b23f;
  --saffron-dim:#b98c32;
  --madder:#b23a2f;
  --madder-deep:#7c2520;
  --sand:#dcc8a0;
  --sand-hi:#f2e7cd;
  --sand-dim:#ab9c80;
  --river:#6f8cc9;
  --ok:#9cbf6a;
  --bad:#e0705f;
  --ink-dark:#1a1530;
  --line:rgba(220,200,160,.18);
  --well:rgba(8,13,34,.5);
  --font-display:"PT Sans Narrow","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"PT Serif",Georgia,"Times New Roman",serif;
  --step--1:clamp(.84rem,.8rem + .2vw,.95rem);
  --step-0:clamp(1.02rem,.96rem + .3vw,1.15rem);
  --step-1:clamp(1.25rem,1.1rem + .6vw,1.5rem);
  --step-2:clamp(1.7rem,1.4rem + 1.4vw,2.4rem);
  --step-3:clamp(2.4rem,1.8rem + 3vw,4rem);
  --radius:6px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --btn-ring:inset 0 0 0 2px rgba(124,37,32,.35),inset 0 0 0 5px var(--saffron),inset 0 0 0 6px rgba(124,37,32,.5);
  --felt-tex:none;
}
[hidden]{display:none!important}
html.big{font-size:112.5%}
html,body{min-height:100%}
body{background:var(--night);color:var(--sand);font-family:var(--font-body);font-size:var(--step-0);line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px;display:flex;flex-direction:column}
.defs{position:absolute;width:0;height:0;overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1;text-wrap:balance;margin:0;color:var(--sand-hi)}
h2{font-size:var(--step-3);line-height:.95}
h1:focus,h2:focus{outline:none}
h3{font-size:var(--step-1);letter-spacing:.03em}
p{margin:0;max-width:64ch}
a{color:var(--saffron)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:3px;border-radius:3px}

/* ---------- motion ---------- */
.rise{animation:rise .75s var(--ease-out) both;animation-delay:calc(var(--i,0) * 65ms + 260ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes fadein{from{opacity:0}}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 12px;background:linear-gradient(var(--night) 0%,rgba(11,19,48,.92) 72%,rgba(11,19,48,0));display:grid;gap:8px}
.navrow{display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sand-hi);text-decoration:none;white-space:nowrap;font-size:1rem}
.brand i{width:10px;height:10px;transform:rotate(45deg);background:var(--saffron);box-shadow:0 0 0 3px rgba(232,178,63,.18)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--font-display);font-size:.98rem;letter-spacing:.03em;color:var(--sand-dim);text-decoration:none;padding:6px 10px;border-radius:4px;white-space:nowrap;transition:color .15s ease,background-color .15s ease}
.nav a:hover{color:var(--sand-hi);background:rgba(220,200,160,.06)}
.nav a[aria-current="page"]{color:var(--ink-dark);background:var(--saffron)}
.tools{display:flex;gap:6px;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:4px;border:1.5px solid rgba(220,200,160,.28);background:rgba(11,19,48,.5);font-family:var(--font-display);font-size:.92rem;letter-spacing:.03em;color:var(--sand-hi)}
.tbtn:hover{border-color:var(--saffron)}
.tbtn[aria-pressed="true"]{border-color:var(--saffron);color:var(--saffron)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq b{width:3px;height:4px;background:currentColor;border-radius:1px}
.tbtn[aria-pressed="true"] .eq b{animation:eq 1s ease-in-out infinite}
.tbtn[aria-pressed="true"] .eq b:nth-child(2){animation-delay:-.4s}
.tbtn[aria-pressed="true"] .eq b:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.hud{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;justify-content:space-between}
.hud[hidden]{display:none!important}
.trail{display:flex;gap:4px;list-style:none;margin:0;padding:0;align-items:center;min-width:0;flex-wrap:wrap}
.trail li{display:flex;align-items:center;gap:5px;font-family:var(--font-display);font-size:.86rem;color:var(--sand-dim);white-space:nowrap}
.trail li+li::before{content:"";width:14px;height:0;border-top:1.5px dashed var(--line);margin-right:2px}
.trail li.done+li::before{border-color:var(--saffron-dim)}
.trail .knot{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--sand-dim);flex:none}
.trail li.done .knot{background:var(--madder);border-color:var(--madder)}
.trail li.now{color:var(--sand-hi)}
.trail li.now .knot{background:var(--saffron);border-color:var(--saffron);animation:knot 2.4s ease-in-out infinite}
@keyframes knot{0%,100%{box-shadow:0 0 0 0 rgba(232,178,63,.5)}60%{box-shadow:0 0 0 7px rgba(232,178,63,0)}}
.meters{display:flex;gap:18px;flex-wrap:wrap}
.meter{display:grid;gap:4px;position:relative}
.meter-l{font-family:var(--font-display);font-size:.82rem;letter-spacing:.04em;color:var(--sand-dim);display:flex;justify-content:space-between;gap:8px}
.meter-l b{color:var(--sand-hi);font-weight:700;font-variant-numeric:tabular-nums}
.beads{display:flex;gap:3px}
.beads i{width:8px;height:8px;transform:rotate(45deg);border:1px solid rgba(220,200,160,.35)}
.beads i.on{background:var(--saffron);border-color:var(--saffron)}
.meter.peace .beads i.on{background:var(--sand);border-color:var(--sand)}
.meter.force .beads i.on{background:var(--madder);border-color:#d05244}
.beads i.pop{animation:pop .7s var(--spring) both;animation-delay:calc(var(--k,0) * 70ms)}
@keyframes pop{0%{transform:rotate(45deg) scale(2.2);box-shadow:0 0 10px rgba(232,178,63,.9)}100%{transform:rotate(45deg) scale(1);box-shadow:none}}
.floater{position:absolute;right:0;top:-4px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;pointer-events:none;animation:float 1.4s var(--ease-out) forwards}
.floater.up{color:var(--saffron)}
.floater.down{color:var(--bad)}
@keyframes float{from{opacity:0;transform:translateY(8px)}20%{opacity:1}to{opacity:0;transform:translateY(-20px)}}

/* settings popover */
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:52px;z-index:8;width:min(320px,calc(100vw - 32px));padding:18px;border-radius:var(--radius);background:#141c42;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:grid;gap:12px;animation:rise .3s var(--ease-out) both}
.pop h3{font-size:1.1rem}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--step--1)}
.sw input{appearance:none;width:42px;height:24px;border-radius:12px;background:rgba(220,200,160,.2);position:relative;cursor:pointer;flex:none;transition:background-color .2s ease}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--sand-hi);transition:transform .2s var(--ease-out)}
.sw input:checked{background:var(--saffron)}
.sw input:checked::after{transform:translateX(18px)}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:grid;gap:8px;width:min(460px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;padding:14px 16px;border-radius:var(--radius);background:#141c42;border:1px solid var(--saffron-dim);box-shadow:0 20px 40px -16px rgba(0,0,0,.8);font-size:var(--step--1);color:var(--sand-hi);animation:rise .4s var(--ease-out) both;display:grid;gap:4px}
.toast b{font-family:var(--font-display);letter-spacing:.05em;color:var(--saffron);font-size:1rem;text-transform:uppercase}
.toast.out{animation:fadeout .3s ease-out forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(8px)}}
.polaris{position:fixed;z-index:4;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;background:transparent;left:0;top:0}
.polaris:focus-visible{outline:2px dashed var(--saffron)}

/* term tooltip */
.term{all:unset;cursor:help;border-bottom:1.5px dotted var(--saffron-dim);color:inherit}
.term:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.tip{position:fixed;z-index:25;max-width:min(300px,calc(100vw - 32px));padding:12px 14px;border-radius:var(--radius);background:#141c42;border:1px solid var(--saffron-dim);font-size:.9rem;line-height:1.5;color:var(--sand-hi);box-shadow:0 16px 30px -12px rgba(0,0,0,.8);pointer-events:none;animation:rise .2s var(--ease-out) both}
.tip b{display:block;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--saffron);margin-bottom:2px}

/* ---------- chapter card ---------- */
.chap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 55%,rgba(18,26,66,.82),rgba(5,8,24,.95));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
.chap[hidden]{display:none!important}
.chap.in{animation:fadein .3s ease-out both}
.chap.out{animation:fadeout .45s ease-out forwards}
.chap-in{display:grid;justify-items:center;gap:10px;text-align:center}
.chap svg{width:min(220px,60vw);height:auto;overflow:visible}
.chap .cd{stroke-dasharray:1;animation:draw 1.1s var(--ease-out) both .15s}
.chap .cs{animation:fadein .5s ease-out both .8s}
.chap-n{font-family:var(--font-display);font-size:1.2rem;letter-spacing:.2em;text-transform:uppercase;color:var(--saffron);animation:rise .6s var(--ease-out) both .25s}
.chap-y{font-family:var(--font-display);font-weight:700;font-size:clamp(4.5rem,17vw,11rem);line-height:.85;color:var(--sand-hi);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 var(--madder-deep);animation:yrin 1s var(--ease-out) both .3s}
@keyframes yrin{from{opacity:0;letter-spacing:.25em;transform:translateY(24px)}}
.chap-t{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(1.3rem,3vw,2rem);letter-spacing:.06em;color:var(--sand);animation:rise .6s var(--ease-out) both .55s}

/* ---------- stage & felt ---------- */
#stage{width:100%;max-width:1040px;margin-inline:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:16px;gap:24px}
.scene{animation:enter .6s var(--ease-out) both}
.scene.leaving{animation:leave .18s ease-out both}
.scene.thud{animation:thud .38s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes leave{to{opacity:0;transform:translateY(-10px)}}
@keyframes thud{30%{transform:translateY(4px)}60%{transform:translateY(-1px)}}
.felt{position:relative;overflow:hidden;background-image:var(--felt-tex),linear-gradient(160deg,var(--felt-2),var(--felt) 60%,#151d45);border-radius:var(--radius);box-shadow:0 40px 80px -36px rgba(3,6,20,.95),inset 0 0 0 1px rgba(220,200,160,.08)}
.felt::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx,25%) var(--my,0%),rgba(232,178,63,.075),transparent 62%)}
.felt::after{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(232,178,63,.28);border-radius:3px;pointer-events:none}
.numeral{position:absolute;top:34px;right:clamp(12px,4vw,44px);font-family:var(--font-body);font-weight:700;font-size:clamp(7rem,18vw,14rem);line-height:.8;letter-spacing:-.02em;color:rgba(232,178,63,.035);-webkit-text-stroke:1.2px rgba(232,178,63,.2);pointer-events:none;user-select:none;animation:numin 1.6s var(--ease-out) both .2s}
@keyframes numin{from{opacity:0;transform:translateX(40px)}}
.band{height:30px;display:block;width:100%;position:relative}
.band svg{display:block;width:100%;height:30px;animation:unroll 1.2s var(--ease-io) both .1s}
.band.bot svg{animation-name:unroll-r}
@keyframes unroll{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes unroll-r{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.panel-body{position:relative;padding:clamp(20px,4vw,48px);display:grid;gap:22px}
.kicker{font-family:var(--font-display);font-size:1rem;letter-spacing:.06em;color:var(--saffron);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.kicker .yr{font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:clamp(20px,4vw,44px);align-items:start}
.cols>*{min-width:0}
.main{display:grid;gap:16px;min-width:0}
.side{display:grid;gap:22px;align-content:start}
.lead{font-size:var(--step-1);line-height:1.45;color:var(--sand-hi)}
.muted{color:var(--sand-dim);font-size:var(--step--1)}
.gloss{border-left:2px solid var(--madder);padding:4px 0 4px 18px;display:grid;gap:8px}
.gloss dl{margin:0;display:grid;gap:6px}
.gloss dt{font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--sand-hi);text-transform:uppercase;letter-spacing:.03em}
.gloss dd{margin:0;font-size:var(--step--1);line-height:1.55;color:var(--sand-dim)}
.gl-h{font-family:var(--font-display);font-size:.9rem;color:var(--saffron)}
.diary{position:relative;padding:18px 18px 16px;background:linear-gradient(170deg,#efe2c2,#dcc8a0);color:#2a2238;border-radius:3px;box-shadow:0 18px 30px -18px rgba(0,0,0,.8);transform:rotate(-1.2deg);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.diary::after{content:"";position:absolute;top:0;right:0;width:22px;height:22px;background:linear-gradient(225deg,transparent 50%,#b8a47c 50%)}
.diary h4{color:#7c2520;font-size:1rem;letter-spacing:.06em;margin-bottom:6px}
.diary p{font-style:italic;font-size:.95rem;line-height:1.55;color:#2a2238}
.diary small{display:block;margin-top:8px;font-size:.75rem;color:#6b5c48;font-style:normal}
.explainer{display:grid;gap:8px;padding:16px 18px;border-radius:var(--radius);background:rgba(232,178,63,.08);border:1px dashed var(--saffron-dim);animation:rise .35s var(--ease-out) both}
.explainer ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:var(--radius);padding:14px 26px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;background:var(--saffron);color:var(--ink-dark);box-shadow:var(--btn-ring);transition:transform .14s ease,background-color .15s ease;white-space:nowrap;justify-self:start;text-decoration:none}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,250,235,.55) 50%,transparent 70%);transform:translateX(-130%)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:hover:not(:disabled){background:#f1c159}.btn:hover::after{transform:translateX(130%);transition:transform .8s var(--ease-out)}}
.btn.pulse{animation:ring 2.8s ease-out infinite 2.6s}
@keyframes ring{0%{box-shadow:var(--btn-ring),0 0 0 0 rgba(232,178,63,.55)}70%,100%{box-shadow:var(--btn-ring),0 0 0 16px rgba(232,178,63,0)}}
.btn.ghost{background:transparent;color:var(--sand-hi);box-shadow:inset 0 0 0 1.5px var(--sand-dim)}
.btn.ghost::after{background:linear-gradient(105deg,transparent 30%,rgba(232,178,63,.18) 50%,transparent 70%)}
@media (hover:hover){.btn.ghost:hover:not(:disabled){background:rgba(220,200,160,.06)}}
.btn.small{padding:9px 16px;font-size:.98rem}
.link{all:unset;cursor:pointer;font-family:var(--font-display);letter-spacing:.04em;color:var(--saffron);border-bottom:1.5px dashed var(--saffron-dim);justify-self:start}
.link:focus-visible{outline:2px solid var(--saffron);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}

/* ---------- options ---------- */
.q{font-size:var(--step-2);margin-top:6px}
.opts{display:grid;gap:10px}
.opt{position:relative;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;padding:12px 16px 12px 12px;border-radius:var(--radius);border:1.5px solid rgba(220,200,160,.22);background:rgba(11,19,48,.35);font-family:var(--font-body);font-size:var(--step-0);line-height:1.4;color:var(--sand-hi);transition:border-color .2s ease,background-color .2s ease,transform .14s ease,opacity .3s ease}
.opt::after{content:"";position:absolute;inset:3px;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .2s ease;background:linear-gradient(90deg,var(--saffron) 55%,transparent 0) 0 0/10px 1.5px repeat-x,linear-gradient(90deg,var(--saffron) 55%,transparent 0) 0 100%/10px 1.5px repeat-x,linear-gradient(0deg,var(--saffron) 55%,transparent 0) 0 0/1.5px 10px repeat-y,linear-gradient(0deg,var(--saffron) 55%,transparent 0) 100% 0/1.5px 10px repeat-y;animation:ants 1.1s linear infinite paused}
@keyframes ants{to{background-position:10px 0,-10px 100%,0 -10px,100% 10px}}
@media (hover:hover){.opt:hover:not(:disabled){border-color:transparent;background:rgba(232,178,63,.07)}.opt:hover:not(:disabled)::after{opacity:.85;animation-play-state:running}.opt:hover:not(:disabled) .opt-k{transform:rotate(-8deg) scale(1.06)}}
.opt:active:not(:disabled){transform:scale(.99)}
.opt-k{width:40px;height:40px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.3rem;color:var(--saffron);border:1.5px dashed var(--saffron-dim);border-radius:50%;transition:transform .3s var(--spring)}
.opt:disabled{cursor:default;opacity:.45}
.opt.picked{opacity:1;border-color:var(--saffron);background:rgba(232,178,63,.1)}
.opt.picked .opt-k{background:var(--saffron);color:var(--ink-dark);border-style:solid;animation:pick .5s var(--spring)}
@keyframes pick{from{transform:scale(.6)}}
.opt.right{opacity:1;border-color:var(--ok);animation:okflash .8s ease-out}
.opt.wrong{opacity:1;border-color:var(--bad);animation:shake .4s ease-out}
@keyframes okflash{from{background:rgba(156,191,106,.28)}}
.keys{font-size:.8rem;color:var(--sand-dim)}

/* ---------- outcome ---------- */
.outcome{display:grid;gap:14px;animation:rise .55s var(--ease-out) both}
.yours{font-style:italic;color:var(--sand)}
.yours b{font-style:normal;font-family:var(--font-display);letter-spacing:.04em;color:var(--saffron);margin-right:6px}
.history{position:relative;padding:22px 22px 22px 24px;border-radius:var(--radius);background:rgba(8,13,34,.6);border:1px solid rgba(178,58,47,.5);display:grid;gap:10px;animation:unveil .8s var(--ease-out) both .2s}
.history.alt{border-color:rgba(111,140,201,.6);background:rgba(20,28,70,.6)}
.history.alt h4{color:#9fb5e6}
@keyframes unveil{from{clip-path:inset(0 0 100% 0);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
.history h4{font-size:1.05rem;letter-spacing:.06em;color:#e58b7c}
.history p{color:var(--sand-hi)}
.stamp{justify-self:start;font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 14px;border:2.5px solid currentColor;border-radius:3px;transform:rotate(-3deg);color:var(--bad);animation:stamp .5s cubic-bezier(.3,1.4,.5,1) both .75s}
.stamp.adapt{color:var(--saffron)}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(2.6)}60%{opacity:1;transform:rotate(-2deg) scale(.94)}100%{opacity:1;transform:rotate(-3deg) scale(1)}}
.event{font-size:var(--step--1);color:var(--sand-dim)}
.event b{color:var(--bad);font-weight:400}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(16px,5vh,60px)}
.hero-copy{display:grid;gap:20px}
.hero .rise{animation-delay:calc(var(--i,0) * 110ms + .75s)}
.hero-pre{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.05em;color:var(--sand-dim)}
.hero h1{font-size:clamp(4.2rem,13vw,10.5rem);line-height:.86;letter-spacing:-.005em;color:var(--sand-hi)}
.hero h1 .ln{display:block;overflow:hidden;padding-block:.06em .03em;margin-block:-.06em -.03em}
.hero h1 .ch{display:inline-block;text-shadow:0 3px 0 rgba(124,37,32,.75);animation:chrise 1s var(--ease-out) both;animation-delay:calc(var(--i) * 55ms + .1s)}
@keyframes chrise{from{transform:translateY(110%) rotate(5deg)}}
.hero-band{max-width:540px}
.hero-sub{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(1.15rem,2.2vw,1.6rem);letter-spacing:.05em;line-height:1.15;color:var(--sand)}
.hero-sub .yr{display:block;font-size:clamp(1.8rem,4vw,2.9rem);color:var(--saffron);letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.hero-lead{font-size:var(--step-1);line-height:1.45;color:var(--sand-hi);max-width:34ch}
.authors{font-size:var(--step--1);color:var(--sand-dim)}
.authors b{color:var(--sand);font-weight:700}
.counter{font-family:var(--font-display);font-size:1rem;letter-spacing:.04em;color:var(--sand-dim)}
.counter b{color:var(--saffron);font-size:1.3rem;font-variant-numeric:tabular-nums}
.medal{position:relative;aspect-ratio:1;max-width:100%;width:min(100%,440px);justify-self:center;perspective:900px;animation:medalin 1.4s var(--ease-out) both .2s}
@keyframes medalin{from{opacity:0;transform:scale(.9) rotate(-6deg)}}
.medal::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(232,178,63,.16),rgba(178,58,47,.08) 55%,transparent);animation:breathe 5s ease-in-out infinite alternate 2s}
@keyframes breathe{from{opacity:.55;transform:scale(.94)}to{opacity:1;transform:scale(1.04)}}
.tilt{position:absolute;inset:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s var(--ease-out);transform-style:preserve-3d}
.tilt .felt{position:absolute;inset:0}
.tilt svg{position:absolute;inset:0;width:100%;height:100%}
.draw{stroke-dasharray:1;animation:draw 2.4s var(--ease-out) both .35s}
.stitchin{animation:fadein .9s ease-out both 1.7s}

/* ---------- idea ---------- */
.idea{font-size:var(--step-2);line-height:1.3;color:var(--sand-hi);font-style:italic;text-transform:none;font-family:var(--font-body);font-weight:400;max-width:30ch;text-wrap:balance}
.idea-l{font-family:var(--font-display);color:var(--saffron);font-size:1rem;letter-spacing:.05em}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0;padding:0;list-style:none}
.rules li{display:grid;gap:6px;align-content:start;padding-top:12px;border-top:1.5px dashed var(--line)}
.rules h3{font-size:1.2rem}
.rules p{font-size:var(--step--1);color:var(--sand-dim)}

/* ---------- sort ---------- */
.pile{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{position:relative;text-align:left;padding:14px 16px;border-radius:var(--radius);background:rgba(11,19,48,.5);border:1.5px solid rgba(220,200,160,.25);font-size:var(--step--1);line-height:1.45;color:var(--sand-hi);transition:border-color .2s ease,transform .3s var(--spring),background-color .2s ease,box-shadow .3s ease}
@media (hover:hover){.card:hover{border-color:var(--sand);transform:translateY(-2px)}}
.card[aria-pressed="true"]{border-color:var(--saffron);background:rgba(232,178,63,.13);transform:translateY(-5px) rotate(-.6deg);box-shadow:0 14px 24px -14px rgba(232,178,63,.5)}
.card.ghost{margin:0;transform:none}
.card.wrong{animation:shake .4s ease-out;border-color:var(--bad)}
.scales{display:block;width:min(340px,100%);margin-inline:auto;height:auto;overflow:visible}
.beam{transform-box:fill-box;transform-origin:center;transition:transform 1s var(--spring)}
.pan{transition:transform 1s var(--spring)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{display:grid;gap:10px;align-content:start;min-height:150px;padding:14px;border-radius:var(--radius);border:2px dashed rgba(220,200,160,.3);background:rgba(8,13,34,.35);text-align:left;transition:border-color .2s ease,background-color .2s ease}
.bin.armed{border-color:var(--saffron);background:rgba(232,178,63,.06);animation:armed 1.6s ease-in-out infinite}
@keyframes armed{50%{background:rgba(232,178,63,.11)}}
.bin.ok{border-color:var(--ok);animation:binflash .7s ease-out}
.bin.no{border-color:var(--bad);animation:shake .4s ease-out}
@keyframes binflash{from{background:rgba(156,191,106,.22)}}
.bin-h{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:1.3rem;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bin.opp .bin-h,.shelf .bin-h{color:var(--saffron)}
.bin.obs .bin-h{color:#e58b7c}
.bin-h small{font-size:.95rem;color:var(--sand-dim);font-variant-numeric:tabular-nums}
.bin-list{display:grid;gap:8px}
.placed{display:block;font-size:.88rem;line-height:1.45;padding:8px 10px;border-radius:4px;background:rgba(24,34,78,.85);border-left:3px solid var(--ok)}
.placed.new{animation:rise .45s var(--ease-out) both}
.placed.bad{border-left-color:var(--bad)}
.placed em{display:block;color:var(--sand-dim);font-size:.82rem;margin-top:4px}
.hint{font-size:var(--step--1);color:var(--sand-dim)}

/* ---------- map ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.map{position:relative;width:100%;max-width:100%;aspect-ratio:600/430}
.map svg{position:absolute;inset:0;width:100%;height:100%;animation:lamp 1.5s var(--ease-out) both .35s}
@keyframes lamp{from{clip-path:circle(0% at 55% 45%)}to{clip-path:circle(85% at 55% 45%)}}
.pin{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;animation:pinin .55s var(--spring) both;animation-delay:calc(var(--i) * 110ms + .9s)}
@keyframes pinin{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}}
.pin::before,.pin::after{content:"";grid-area:1/1}
.pin::before{width:14px;height:14px;transform:rotate(45deg);background:var(--night);border:2px solid var(--sand);transition:background-color .2s ease,border-color .2s ease,transform .35s var(--spring)}
.pin::after{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--saffron);opacity:0}
.pin:not(.seen)::after{animation:ripple 2.4s ease-out infinite;animation-delay:calc(var(--i) * 300ms + 1.6s)}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{transform:scale(2.8);opacity:0}}
@media (hover:hover){.pin:hover::before{transform:rotate(45deg) scale(1.25)}}
.pin.seen::before{background:var(--madder);border-color:#e58b7c}
.pin.on::before{background:var(--saffron);border-color:var(--saffron);transform:rotate(45deg) scale(1.35)}
.pin span{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:.85rem;white-space:nowrap;color:var(--sand-hi);text-shadow:0 1px 3px var(--night),0 0 6px var(--night);pointer-events:none}
.place{display:grid;gap:10px;padding:18px;border-radius:var(--radius);background:var(--well);border:1px solid var(--line);min-height:200px;align-content:start}
.place.swap>*{animation:rise .45s var(--ease-out) both;animation-delay:calc(var(--i,0) * 60ms)}
.place h3{color:var(--saffron)}
.place p{font-size:var(--step--1);line-height:1.55}
.place .yr{font-family:var(--font-display);color:var(--sand-dim);font-variant-numeric:tabular-nums}
.count{font-family:var(--font-display);color:var(--sand-dim);font-size:.95rem;font-variant-numeric:tabular-nums}
.pathmap svg{width:100%;height:auto;display:block}
.pathline{stroke-dasharray:1;animation:draw 2.6s var(--ease-io) both .6s}

/* ---------- final ---------- */
.tl{overflow-x:auto;margin-inline:-4px;padding:4px}
.tl svg{display:block;min-width:600px;width:100%;height:auto}
.tl .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s var(--ease-io) both .5s}
.tl .grow2{transform-box:fill-box;transform-origin:left center;animation:grow .7s var(--ease-out) both 2.1s}
.tl .fd{animation:fadein .6s ease-out both;animation-delay:var(--d,1s)}
@keyframes grow{from{transform:scaleX(0)}}
.verdict{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.verdict>div{display:grid;gap:8px;align-content:start;padding:18px;border-radius:var(--radius);background:rgba(8,13,34,.45)}
.verdict .r{border-top:3px solid var(--madder)}
.verdict .a{border-top:3px solid var(--saffron)}
.verdict h3{font-size:1.4rem}
.verdict p{font-size:var(--step--1);color:var(--sand)}
.answer{font-size:var(--step-1);line-height:1.45;color:var(--sand-hi);max-width:52ch}
.path{display:grid;gap:12px;padding-top:16px;border-top:1.5px dashed var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.split>*{min-width:0}

/* ---------- mini-games ---------- */
.mg{display:grid;gap:16px}
.mg-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.stat{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.04em;color:var(--sand-dim);font-variant-numeric:tabular-nums}
.stat b{color:var(--saffron);font-size:1.25rem}
.raid{position:relative;width:100%;height:240px;border-radius:var(--radius);overflow:hidden;background:linear-gradient(#0f1840,#1d2552 70%,#2e2840);touch-action:manipulation;cursor:pointer}
.raid canvas{position:absolute;inset:0;width:100%;height:100%}
.raid .big{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:4rem;color:var(--sand-hi);text-shadow:0 3px 0 var(--madder-deep);pointer-events:none}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:min(100%,460px);margin-inline:auto;touch-action:manipulation}
.cell{position:relative;aspect-ratio:1;border:0;border-radius:3px;background:#202a5a;padding:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.8rem;color:var(--sand-hi);transition:background-color .2s ease}
.cell.h{background-color:#2b2b55;background-image:linear-gradient(135deg,transparent 45%,rgba(220,200,160,.35) 46% 54%,transparent 55%),linear-gradient(225deg,transparent 45%,rgba(220,200,160,.35) 46% 54%,transparent 55%);background-size:50% 50%;background-position:0 100%,100% 100%;background-repeat:no-repeat}
.cell.w{background:repeating-linear-gradient(0deg,#23407a 0 5px,#2d4f8f 5px 10px)}
.cell.f{background:repeating-linear-gradient(90deg,#3a5a9a 0 4px,#c9b48a 4px 6px)}
.cell.s{background:repeating-linear-gradient(45deg,#c9a96a 0 6px,#b8955a 6px 12px)}
.cell.opt-move{box-shadow:inset 0 0 0 2px var(--saffron)}
.cell.opt-move::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:var(--saffron);opacity:.7;animation:ripple 1.6s ease-out infinite}
.tok{width:72%;height:72%;display:grid;place-items:center;transition:transform .3s var(--spring)}
.tok.u{background:var(--saffron);color:var(--ink-dark);transform:rotate(45deg);border-radius:3px}
.tok.u span{transform:rotate(-45deg)}
.tok.u.sel{box-shadow:0 0 0 3px var(--sand-hi);animation:knot 1.4s ease-in-out infinite}
.tok.p{background:var(--madder);border-radius:50%;color:var(--sand-hi);box-shadow:0 0 0 2px #e58b7c}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--sand-dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:2px;display:inline-block}
.chrono{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chrono li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius);background:rgba(11,19,48,.5);border:1.5px solid rgba(220,200,160,.22);user-select:none;transition:border-color .2s ease,background-color .2s ease}
.chrono li.drag{border-color:var(--saffron);background:rgba(232,178,63,.12);box-shadow:0 12px 24px -12px rgba(0,0,0,.8);position:relative;z-index:2}
.chrono li.good{border-color:var(--ok)}
.chrono li.badp{border-color:var(--bad)}
.handle{cursor:grab;width:30px;height:30px;display:grid;place-items:center;color:var(--sand-dim);border:0;background:none;padding:0;touch-action:none}
.handle svg{width:16px;height:16px}
.mv{display:flex;gap:4px}
.mv button{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);background:none;color:var(--sand-hi);font-family:var(--font-display)}
.yr-tag{font-family:var(--font-display);font-weight:700;color:var(--saffron);font-variant-numeric:tabular-nums;margin-right:8px}
.chain{display:grid;gap:0;justify-items:start}
.link-node{padding:12px 16px;border-radius:var(--radius);background:rgba(232,178,63,.12);border:1.5px solid var(--saffron-dim);color:var(--sand-hi);max-width:520px;animation:rise .4s var(--ease-out) both}
.link-node small{display:block;color:var(--sand-dim);font-size:.82rem;margin-top:4px}
.arrow{width:30px;height:34px;margin-left:24px}
.arrow path{stroke-dasharray:1;animation:draw .5s var(--ease-out) both}
.shelves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.shelf{display:grid;gap:8px;align-content:start;min-height:120px;padding:12px;border-radius:var(--radius);border:2px dashed rgba(220,200,160,.3);background:rgba(8,13,34,.35);text-align:left}
.shelf .bin-h{font-size:1.05rem}
.shelf.armed{border-color:var(--saffron)}
.shelf.no{animation:shake .4s ease-out;border-color:var(--bad)}
.src{display:grid;gap:6px;padding:16px 18px;border-radius:var(--radius);background:linear-gradient(170deg,#efe2c2,#d9c39a);color:#2a2238;transform:rotate(-.5deg)}
.src h4{color:#7c2520;font-size:1.25rem}
.src p{font-size:.92rem;color:#3a3050}
.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.voice{display:grid;gap:10px;text-align:left;padding:18px;border-radius:var(--radius);border:1.5px solid rgba(220,200,160,.25);background:rgba(11,19,48,.45);font-style:italic;color:var(--sand-hi);line-height:1.5}
.voice.ok{border-color:var(--ok)}
.voice.no{border-color:var(--bad);animation:shake .4s ease-out}
.voice b{font-style:normal;font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--saffron)}
.lives{display:flex;gap:6px}
.lives svg{width:28px;height:28px;transition:opacity .3s ease,transform .3s var(--spring)}
.lives svg.lost{opacity:.18;transform:scale(.8)}
.timer{width:48px;height:48px}
.timer circle.t{transition:stroke-dashoffset .25s linear}

/* hub */
.hub{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.game{grid-column:span 2;display:grid;gap:10px;align-content:start;padding:20px;border-radius:var(--radius);background:rgba(8,13,34,.45);border:1px solid var(--line);text-align:left;transition:border-color .2s ease,transform .25s var(--spring)}
.game.wide{grid-column:span 3}
@media (hover:hover){.game:hover{border-color:var(--saffron);transform:translateY(-3px)}}
.game h3{font-size:1.45rem}
.game p{font-size:var(--step--1);color:var(--sand-dim)}
.game .best{font-family:var(--font-display);font-size:.9rem;color:var(--saffron)}
.game svg{width:56px;height:56px}

/* learning */
.flash{perspective:1000px;width:min(100%,520px);height:260px;margin-inline:auto;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .7s var(--ease-io);transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);display:grid;place-items:center;text-align:center;padding:24px}
.face.front{background:rgba(8,13,34,.55);border:1.5px solid var(--saffron-dim)}
.face.front b{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.8rem);text-transform:uppercase;color:var(--sand-hi);line-height:1}
.face.back{background:linear-gradient(170deg,#efe2c2,#d9c39a);color:#2a2238;transform:rotateY(180deg);font-size:1.05rem}
html.calm .flash.flip .face.front,html.calm .face.back{backface-visibility:visible}
html.calm .flash .face.back{display:none}
html.calm .flash.flip .face.front{display:none}
html.calm .flash.flip .face.back{display:grid;transform:none}
html.calm .flash.flip .flash-in{transform:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:8px 14px;border-radius:4px;border:1.5px solid var(--line);background:none;font-family:var(--font-display);font-size:1rem;letter-spacing:.03em;color:var(--sand-hi)}
.tab[aria-selected="true"]{background:var(--saffron);color:var(--ink-dark);border-color:var(--saffron)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cmp>div{display:grid;gap:10px;align-content:start;padding:18px;border-radius:var(--radius);background:var(--well);animation:rise .4s var(--ease-out) both}
.cmp dl{margin:0;display:grid;gap:8px}
.cmp dt{font-family:var(--font-display);font-size:.85rem;letter-spacing:.05em;color:var(--sand-dim);text-transform:uppercase}
.cmp dd{margin:0;font-size:var(--step--1);color:var(--sand-hi)}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;margin:0}
.terms div{padding-top:10px;border-top:1.5px dashed var(--line)}
.terms dt{font-family:var(--font-display);font-weight:700;text-transform:uppercase;color:var(--sand-hi);letter-spacing:.03em}
.terms dd{margin:2px 0 0;font-size:var(--step--1);color:var(--sand-dim)}
.field{display:grid;gap:6px}
.field label{font-family:var(--font-display);letter-spacing:.04em;color:var(--sand)}
.inp{width:100%;max-width:420px;padding:11px 14px;border-radius:4px;border:1.5px solid rgba(220,200,160,.35);background:rgba(8,13,34,.6);color:var(--sand-hi)}
.inp:focus{border-color:var(--saffron);outline:none}
.inp::placeholder{color:#8f8470}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chips span{display:inline-block;padding:8px 14px;border-radius:99px;border:1.5px solid rgba(220,200,160,.3);font-size:.92rem;color:var(--sand-hi);transition:background-color .15s ease,border-color .15s ease}
.chips input:checked+span{background:var(--saffron);border-color:var(--saffron);color:var(--ink-dark)}
.chips input:focus-visible+span{outline:2px solid var(--saffron);outline-offset:2px}
.survey{display:grid;gap:18px}
.survey fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.survey legend{font-family:var(--font-display);font-size:1.15rem;color:var(--sand-hi);margin-bottom:6px;padding:0}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board td,.board th{padding:10px 8px;text-align:left;border-bottom:1px dashed var(--line);font-size:var(--step--1)}

.qrbox{display:grid;justify-items:center;gap:12px;padding:22px;border-radius:var(--radius);background:var(--sand-hi);color:var(--ink-dark);width:min(100%,340px)}

.preview{width:min(100%,280px);border-radius:var(--radius);box-shadow:0 20px 40px -20px rgba(0,0,0,.9)}

.plain{margin:0;padding-left:1.2em;display:grid;gap:6px}

/* ---------- defense slides ---------- */
.deck{position:fixed;inset:0;z-index:15;background:radial-gradient(ellipse at 50% 30%,#18225a,#070c24);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

<script>
(() => {
"use strict";
/* ===================== CONFIG (жобаны баптау) ===================== */
const SITE_URL_DEFAULT = "https://claude.ai/artifact/37nmPibKCmBQ7ZoS4QLnPb";
const GOOGLE_FORM_URL = ""; // Google Form сілтемесін осында қойыңыз
const TEAM = [
  { name: "Маулен", role: "" },
  { name: "Сагди", role: "" },
  { name: "Ералы", role: "" },
];

/* ===================== utils ===================== */
const reduceMQ = matchMedia("(prefers-reduced-motion: reduce)");
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LS = {
  get(k, d) { try { const v = localStorage.getItem("eset." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("eset." + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("eset." + k); } catch (e) {} },
};
const SS = {
  get(k) { try { return sessionStorage.getItem("eset." + k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem("eset." + k, v); } catch (e) {} },
};
const prefs = Object.assign({ music: true, sfx: true, big: false, calm: false, sound: false }, LS.get("prefs", {}));
const RM = () => reduceMQ.matches || prefs.calm;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const siteUrl = () => LS.get("siteurl", SITE_URL_DEFAULT) || SITE_URL_DEFAULT;
function applyPrefs() {
  document.documentElement.classList.toggle("big", !!prefs.big);
  document.documentElement.classList.toggle("calm", !!prefs.calm);
  LS.set("prefs", prefs);
}
applyPrefs();
function toast(title, text, ms = 4200) {
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `<b>${esc(title)}</b><span>${esc(text)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 320); }, ms);
}

/* ===================== ORNAMENT ===================== */
function hornD(a, s, k = 0.19, tmax = Math.PI * 2.25) {
  let d = "";
  for (let t = 0, i = 0; t <= tmax + 1e-6; t += 0.1, i++) {
    const r = a * Math.exp(-k * t);
    d += (i ? "L" : "M") + (s * (-a + r * Math.cos(t))).toFixed(2) + " " + (-r * Math.sin(t)).toFixed(2) + " ";
  }
  return d;
}
const motifD = (a, stem) => hornD(a, 1) + hornD(a, -1) + `M0 0L0 ${stem}`;
const diamond = (x, y, r) => `M${x} ${y - r}L${x + r} ${y}L${x} ${y + r}L${x - r} ${y}Z`;
(function buildDefs() {
  const m = motifD(7, 9);
  $("#defs").innerHTML = `
  <pattern id="band" width="56" height="30" patternUnits="userSpaceOnUse">
    <path d="M0 3H56M0 27H56" stroke="#7c2520" stroke-width="2.4" fill="none"/>
    <path d="M0 3H56M0 27H56" stroke="#e8b23f" stroke-width="1.1" stroke-dasharray="3 2.4" fill="none"/>
    <g transform="translate(28 17)">
      <path d="${m}" stroke="#7c2520" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${m}" stroke="#e8b23f" stroke-width="1.3" fill="none" stroke-dasharray="2.6 1.8" stroke-linecap="round"/>
    </g>
    <path d="${diamond(0, 15, 3.4)}${diamond(56, 15, 3.4)}" fill="#b23a2f"/>
  </pattern>`;
  const cm = motifD(22, 14);
  $("#chapOrn").innerHTML = `
    <path d="M-58 14H-26M26 14H58" stroke="#7c2520" stroke-width="2" pathLength="1" class="cd"/>
    <path d="${cm}" fill="none" stroke="#b23a2f" stroke-width="5" stroke-linecap="round" pathLength="1" class="cd"/>
    <path d="${cm}" fill="none" stroke="#e8b23f" stroke-width="1.6" stroke-dasharray="3 2.2" stroke-linecap="round" class="cs"/>
    <path d="${diamond(-58, 14, 3)}${diamond(58, 14, 3)}" fill="#e8b23f" class="cs"/>`;
})();
const band = pos => `<div class="band ${pos}" aria-hidden="true"><svg preserveAspectRatio="none"><rect width="100%" height="30" fill="url(#band)"/></svg></div>`;
function rosetteSVG() {
  const a = 30, stem = 56, md = motifD(a, stem);
  const groups = [0, 90, 180, 270].map(r => `<g transform="rotate(${r}) translate(0 ${-stem})">#</g>`);
  const layer = attrs => groups.map(g => g.replace("#", `<path d="${md}" ${attrs}/>`)).join("");
  const frame = "M-100 -100H100V100H-100Z M-90 -90H90V90H-90Z";
  const diags = [[-78, -78], [78, -78], [78, 78], [-78, 78]].map(([x, y]) => diamond(x, y, 7)).join("");
  const small = motifD(10, 8);
  const corners = [[-78, -78, 45], [78, -78, 135], [78, 78, 225], [-78, 78, 315]];
  return `<svg viewBox="-112 -112 224 224" role="img" aria-label="Қошқар мүйіз ою-өрнегі">
    <path d="${frame}" fill="none" stroke="#7c2520" stroke-width="3" pathLength="1" class="draw"/>
    ${layer('fill="none" stroke="#b23a2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw"')}
    <g class="stitchin">
      <path d="${frame}" fill="none" stroke="#e8b23f" stroke-width="1.2" stroke-dasharray="3 2.4"/>
      ${layer('fill="none" stroke="#e8b23f" stroke-width="2" stroke-dasharray="4 2.6" stroke-linecap="round"')}
      ${layer('fill="none" stroke="#dcc8a0" stroke-width=".8" stroke-dasharray="1.5 3" stroke-linecap="round"')}
      <path d="${diamond(0, 0, 13)}" fill="#e8b23f"/><path d="${diamond(0, 0, 6)}" fill="#7c2520"/>
      <path d="${diags}" fill="#b23a2f"/>
      ${corners.map(([x, y, r]) => `<g transform="translate(${x} ${y}) rotate(${r}) translate(0 -12)"><path d="${small}" fill="none" stroke="#e8b23f" stroke-width="1.2" stroke-dasharray="2 1.6"/></g>`).join("")}
    </g></svg>`;
}
function shanyrakSVG(cls = "") {
  return `<svg viewBox="-16 -16 32 32" class="${cls}" aria-hidden="true"><circle r="13" fill="none" stroke="#e8b23f" stroke-width="2.6"/><circle r="13" fill="none" stroke="#7c2520" stroke-width="1" stroke-dasharray="2 2"/><path d="M-12 -4Q0 -9 12 -4M-12 4Q0 9 12 4M-4 -12Q-9 0 -4 12M4 -12Q9 0 4 12" fill="none" stroke="#e8b23f" stroke-width="1.8"/></svg>`;
}
(function makeFelt() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 200;
    const g = c.getContext("2d");
    for (let i = 0; i < 1800; i++) {
      const x = Math.random() * 200, y = Math.random() * 200, l = 2 + Math.random() * 8, a = Math.random() * Math.PI * 2;
      g.strokeStyle = Math.random() < .55 ? `rgba(255,240,210,${.025 + Math.random() * .04})` : `rgba(0,0,12,${.05 + Math.random() * .06})`;
      g.lineWidth = .7; g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a + 1) * l * .5, y + Math.sin(a + 1) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    document.documentElement.style.setProperty("--felt-tex", `url(${c.toDataURL()})`);
  } catch (e) {}
})();

/* ===================== SOUND: wind + dombra (WebAudio, no files) ===================== */
const Snd = (() => {
  let ac = null, master, music, sfx, windG, windF, playing = false, timer = null, nextT = 0, step = 0, mood = "night";
  const bufs = {};
  const N = { D3: 146.83, A3: 220, G3: 196, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, G5: 783.99 };
  const MEL = [
    "A4", "", "G4", "A4", "C5", "", "A4", "",
    "G4", "", "F4", "G4", "A4", "", "", "",
    "D5", "", "C5", "A4", "G4", "", "A4", "",
    "F4", "", "E4", "F4", "D4", "", "", "",
    "A4", "A4", "C5", "", "D5", "", "C5", "A4",
    "G4", "", "A4", "G4", "F4", "", "G4", "",
    "A4", "", "G4", "F4", "E4", "", "F4", "E4",
    "D4", "", "", "", "D4", "", "", "",
  ];
  const BPM = 92, EIGHTH = 60 / BPM / 2;
  function init() {
    if (ac) return true;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .85; master.connect(ac.destination);
      music = ac.createGain(); music.gain.value = 0; music.connect(master);
      sfx = ac.createGain(); sfx.gain.value = .7; sfx.connect(master);
      const nb = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = nb.getChannelData(0);
      let b = 0; for (let i = 0; i < d.length; i++) { b = .97 * b + .03 * (Math.random() * 2 - 1); d[i] = b * 3.2; }
      const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
      windF = ac.createBiquadFilter(); windF.type = "bandpass"; windF.frequency.value = 520; windF.Q.value = .7;
      windG = ac.createGain(); windG.gain.value = 0;
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .07; lg.gain.value = 260; lfo.connect(lg); lg.connect(windF.frequency); lfo.start();
      src.connect(windF); windF.connect(windG); windG.connect(master); src.start();
      return true;
    } catch (e) { ac = null; return false; }
  }
  function ks(freq, dur = 1.8, bright = .5) {
    const key = freq + ":" + bright;
    if (bufs[key]) return bufs[key];
    const sr = ac.sampleRate, len = Math.floor(sr * dur), buf = ac.createBuffer(1, len, sr), out = buf.getChannelData(0);
    const P = Math.max(2, Math.round(sr / freq)), ring = new Float32Array(P);
    let prev = 0; for (let i = 0; i < P; i++) { const n = Math.random() * 2 - 1; prev = prev + bright * (n - prev); ring[i] = prev; }
    let idx = 0;
    for (let i = 0; i < len; i++) { const a = ring[idx], b2 = ring[(idx + 1) % P]; out[i] = a; ring[idx] = .4985 * (a + b2); idx = (idx + 1) % P; }
    for (let i = 0; i < 80 && i < len; i++) out[i] *= i / 80;
    return (bufs[key] = buf);
  }
  function pluck(note, t, vol = .5, dest, pan = 0, bright = .5) {
    const f = typeof note === "number" ? note : N[note];
    if (!f) return;
    const s = ac.createBufferSource(); s.buffer = ks(f, 1.8, bright);
    const g = ac.createGain(); g.gain.value = vol;
    let node = g;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
    s.connect(g); node.connect(dest || music); s.start(t);
  }
  function thump(t, f = 80, vol = .5, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f * 1.8, t); o.frequency.exponentialRampToValueAtTime(f, t + .08);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .28);
    o.connect(g); g.connect(dest || sfx); o.start(t); o.stop(t + .3);
  }
  function noiseBurst(t, dur, freq, vol, dest, type = "lowpass") {
    const len = Math.max(1, Math.floor(ac.sampleRate * dur)), b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = ac.createBufferSource(); s.buffer = b;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(dest || sfx); s.start(t);
    return { f, g };
  }
  function schedule() {

const Store = { db: null, writeOk: null, plays: null, scores: null, survey: null, loading: true };
const storeListeners = new Set();
const notifyStore = () => storeListeners.forEach(fn => { try { fn(); } catch (e) {} });
(async () => {
  const fail = setTimeout(() => { Store.loading = false; notifyStore(); }, 10000);
  const done = () => { clearTimeout(fail); Store.loading = false; notifyStore(); };
  try {
    if (!window.claude || typeof window.claude.use !== "function") return done();
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (user) { try { const c = await user.can("data.write"); Store.writeOk = c === null ? null : c; } catch (e) {} }
    if (!db) return done();
    Store.db = db;
    db.collection("plays").limit(1000).onSnapshot(s => { Store.plays = s.size; if (!s.metadata.fromCache) done(); else notifyStore(); }, () => done());
    db.collection("scores").orderBy("score", "desc").limit(200).onSnapshot(s => { Store.scores = s.docs.map(d => d.data()); notifyStore(); }, () => {});
    db.collection("survey").limit(1000).onSnapshot(s => { Store.survey = s.docs.map(d => d.data()); notifyStore(); }, () => {});
  } catch (e) { done(); }
})();
async function storeAdd(col, data) {
  if (!Store.db || Store.writeOk === false) return false;
  try { await Store.db.collection(col).add(data); return true; }
  catch (e) { if (e && e.code === "invalid_argument") Store.writeOk = false; return false; }
}

function linkTerms(root) {
  const used = new Set();
  $$(".lead, .main > p, .history p, .verdict p", root).forEach(p => {
    const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      if (!node.parentElement || node.parentElement.closest(".term, button, a")) return;
      for (const g of GLOSS) {
        if (used.has(g.k)) continue;
        const re = new RegExp(`(${g.re}[^\\s.,:;!?»«()]*)`, "iu");
        const m = node.nodeValue.match(re);
        if (!m) continue;
        used.add(g.k);
        const word = m[1], after = node.splitText(m.index);
        after.nodeValue = after.nodeValue.slice(word.length);
        const b = document.createElement("button"); b.className = "term"; b.type = "button"; b.dataset.k = g.k; b.textContent = word;
        node.parentNode.insertBefore(b, after);
        break;
      }
    });
  });
}

MG.raid = (el, done, o = {}) => {
  el.innerHTML = `<div class="mg"><div class="mg-head"><span class="stat">Кері бұрылды: <b id="rHits">0</b>/10</span><span class="stat" id="rMsg"></span></div>
    <div class="raid" id="raidBox" role="application" aria-label="Керуен шабуылы ойыны" tabindex="0"><canvas></canvas><div class="big" id="rBig">Дайынсың ба?</div></div>
    <div class="row"><button class="btn" id="rStart">Бастау</button><button class="btn ghost" id="rHit" disabled>Шап!</button>${skipBtn(o)}</div></div>`;
  const box = $("#raidBox", el), cv = $("canvas", box), g = cv.getContext("2d");
  let W = 0, H = 0, camels = [], running = false, last = 0, hits = 0, T = 0, rings = [], ended = false;
  const fit = () => { const D = Math.min(2, devicePixelRatio || 1); W = box.clientWidth || 600; H = box.clientHeight || 240; cv.width = W * D; cv.height = H * D; g.setTransform(D, 0, 0, D, 0, 0); };
  fit();
  const zoneX = () => W * .34, ground = () => H * .78;
  function camelShape(x, y, s, ph, back, alpha) {
    g.save(); g.globalAlpha = alpha; g.translate(x, y); if (!back) g.scale(-1, 1);
    g.fillStyle = g.strokeStyle = back ? "#e8b23f" : "#0e1538"; g.lineCap = "round"; g.lineWidth = 2.2 * s;
    [[-6, 0], [-3.5, Math.PI], [4, Math.PI * .5], [6.5, Math.PI * 1.5]].forEach(([lx, o2]) => { const sw = Math.sin(ph + o2) * 2.6 * s; g.beginPath(); g.moveTo(lx * s, -9 * s); g.lineTo(lx * s + sw, 0); g.stroke(); });
    g.beginPath(); g.ellipse(0, -11 * s, 9 * s, 4 * s, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(-1 * s, -14 * s, 5 * s, 3.8 * s, 0, Math.PI, 0); g.fill();
    g.fillStyle = back ? "#7c2520" : "#b98c32"; g.fillRect(-5 * s, -19 * s, 8 * s, 4 * s);
    g.fillStyle = back ? "#e8b23f" : "#0e1538"; g.lineWidth = 3 * s; g.beginPath(); g.moveTo(7.5 * s, -12 * s); g.quadraticCurveTo(11 * s, -13 * s, 12 * s, -18 * s); g.stroke();
    g.beginPath(); g.ellipse(13.6 * s, -18.4 * s, 2.6 * s, 1.5 * s, .2, 0, 6.283); g.fill();
    g.restore();
  }
  function flashMsg(t, col) { const m = $("#rMsg", el); if (!m) return; m.textContent = t; m.style.color = col; }
  function render(dt) {
    T += dt; g.clearRect(0, 0, W, H);
    g.fillStyle = "#2e2840"; g.beginPath(); g.moveTo(0, H); g.lineTo(0, ground()); for (let x = 0; x <= W; x += 10) g.lineTo(x, ground() + Math.sin(x * .02) * 3); g.lineTo(W, H); g.fill();
    const fx0 = 10, fy = ground();
    g.fillStyle = "#0b1130"; g.fillRect(fx0, fy - 40, 46, 40); for (let i = 0; i < 4; i++) g.fillRect(fx0 + i * 13, fy - 48, 8, 8);
    g.fillStyle = "rgba(232,178,63,.45)"; g.font = "13px 'PT Sans Narrow'"; g.fillText("бекініс", fx0 + 4, fy - 54);
    const zx = zoneX(), zy = ground() - 12;
    g.save(); g.translate(zx, zy); g.strokeStyle = "rgba(232,178,63,.85)"; g.setLineDash([5, 4]); g.lineWidth = 2; g.lineDashOffset = -T * 20; g.beginPath(); g.arc(0, 0, 30, 0, 6.283); g.stroke(); g.setLineDash([]);
    g.strokeStyle = "rgba(232,178,63,.25)"; g.beginPath(); g.arc(0, 0, 14, 0, 6.283); g.stroke(); g.restore();
    for (const c of camels) {
      if (c.state === "go") { c.x -= c.v * dt; if (c.x < zx - 45 && !c.missed) { c.missed = true; flashMsg("Кетіп қалды", "#e0705f"); Snd.bad(); } if (c.x < 40) c.state = "gone"; }
      else if (c.state === "back") { c.x += c.v * 1.4 * dt; c.a -= dt * .6; if (c.a <= 0) c.state = "done"; }
      if ((c.state === "go" || c.state === "back") && c.x < W + 60) camelShape(c.x, ground(), 1.5, T * 8 + c.x * .05, c.state === "back", Math.max(0, c.a));
    }
    for (const f of rings) { f.t += dt; g.globalAlpha = Math.max(0, 1 - f.t * 1.5); g.strokeStyle = "#e8b23f"; g.lineWidth = 2; g.beginPath(); g.arc(f.x, f.y, 10 + f.t * 80, 0, 6.283); g.stroke(); g.globalAlpha = 1; }
    rings = rings.filter(f => f.t < .7);
  }
  function loop(now) {
    if (!running || !el.isConnected) return;
    const dt = Math.min(.05, (now - (last || now)) / 1000); last = now; render(dt);
    if (camels.length && camels.every(c => c.state === "gone" || c.state === "done")) return finish();
    requestAnimationFrame(loop);
  }
  async function begin() {
    $("#rStart", el).disabled = true; hits = 0; camels = []; ended = false; $("#rHits", el).textContent = 0; flashMsg("", "");
    const big = $("#rBig", el);
    for (const n of ["3", "2", "1", "Шап!"]) { if (!el.isConnected) return; big.textContent = n; Snd.click(); await sleep(RM() ? 250 : 600); }
    big.textContent = ""; $("#rHit", el).disabled = false; running = true; last = 0;
    let x = W + 40;
    for (let i = 0; i < 10; i++) { const v = (RM() ? 90 : 120) + Math.random() * 70 + i * 6; camels.push({ x, v, state: "go", a: 1, missed: false }); x += 130 + Math.random() * 140; }

  }
  function finish() {

  }
  $("#rStart", el).onclick = begin;
  $("#rHit", el).onclick = strike;
  box.addEventListener("pointerdown", e => { if (running) { e.preventDefault(); strike(); } });
  box.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); strike(); } });
  const sk = $("[data-skip]", el); if (sk) sk.onclick = () => { running = false; o.skip(); };
  render(0);
  window.addEventListener("resize", () => { if (el.isConnected) { fit(); render(0); } });
};

const ESC_MAP = [".......", ".hh..h.", ".h...h.", "...h...", "wfwwwfw", "....h..", ".h.....", "sssssss"];
MG.escape = (el, done, o = {}) => {
  const R = ESC_MAP.length, C = 7, cellT = (r, c) => ESC_MAP[r][c];
  let units, purs, sel, moved, over;
  const inB = (r, c) => r >= 0 && r < R && c >= 0 && c < C;
  const pursAt = (r, c) => purs.some(p => p.r === r && p.c === c);
  const unitAt = (r, c) => units.findIndex(u => u.alive && !u.safe && u.r === r && u.c === c);
  function movesFor(u) {
    const out = [];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
      for (let k = 1; k <= 2; k++) {
        const r = u.r + dr * k, c = u.c + dc * k;
        if (!inB(r, c)) break;
        const t = cellT(r, c);
        if (t === "w" || pursAt(r, c) || unitAt(r, c) >= 0) break;
        out.push([r, c]);
        if (t === "s") break;
      }
    });
    out.push([u.r, u.c]);
    return out;
  }
  function pursStep(p) {
    const ok = (r, c) => inB(r, c) && !"hws".includes(cellT(r, c)) && !purs.some(q => q !== p && q.r === r && q.c === c);
    const targets = units.filter(u => u.alive && !u.safe && !"hs".includes(cellT(u.r, u.c)));
    if (!targets.length) return;
    const dist = Array.from({ length: R }, () => Array(C).fill(-1)), q = [];
    targets.forEach(u => { dist[u.r][u.c] = 0; q.push([u.r, u.c]); });
    while (q.length) { const [r, c] = q.shift(); [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => { const nr = r + dr, nc = c + dc; if (inB(nr, nc) && dist[nr][nc] < 0 && !"hws".includes(cellT(nr, nc))) { dist[nr][nc] = dist[r][c] + 1; q.push([nr, nc]); } }); }
    let bestM = null, bd = dist[p.r][p.c] < 0 ? 1e9 : dist[p.r][p.c];
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => { const nr = p.r + dr, nc = p.c + dc; if (ok(nr, nc) && dist[nr][nc] >= 0 && dist[nr][nc] < bd) { bd = dist[nr][nc]; bestM = [nr, nc]; } });
    if (bestM) { p.r = bestM[0]; p.c = bestM[1]; }
  }
  function reset() {
    units = [{ r: 0, c: 1, alive: true, safe: false, n: "1" }, { r: 0, c: 5, alive: true, safe: false, n: "2" }];
    purs = [{ r: 3, c: 0 }, { r: 5, c: 6 }]; sel = 0; moved = [false, false]; over = false;
    $("#escCtl", el).innerHTML = "";
    paint("Жасақты таңда, сосын жарқыраған торды бас. Ат 1 немесе 2 тор жүреді. Тұрған орнын басса, орнында қалады.");
  }
  function endTurn() {
    purs.forEach(p => { pursStep(p); const i = units.findIndex(u => u.alive && !u.safe && u.r === p.r && u.c === p.c); if (i >= 0) { units[i].alive = false; Snd.bad(); toast("Жасақ " + units[i].n + " қолға түсті", "Жазалаушылар қуып жетті."); } });
    moved = units.map(u => !u.alive || u.safe);
    sel = moved.findIndex(m => !m);
    check();
  }
  function check() {
    const active = units.filter(u => u.alive && !u.safe);
    if (!active.length) {
      over = true;
      const saved = units.filter(u => u.safe).length;
      setBest("escape", saved);
      paint(saved === 2 ? "Екі жасақ та Үстіртке жетті!" : saved === 1 ? "Бір жасақ құтылды." : "Екі жасақ та қолға түсті.");
      $("#escCtl", el).innerHTML = `<button class="btn ghost small" id="escRetry">Қайта ойнау</button>`;
      $("#escRetry", el).onclick = reset;
      saved ? Snd.ok() : Snd.bad();
      done && done({ saved });
      return;
    }
    paint(sel >= 0 ? `Жасақ ${units[sel].n} жүреді.` : "");
  }
  function paint(msg) {
    const opts = !over && sel >= 0 ? movesFor(units[sel]) : [];
    let h = "";
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const t = cellT(r, c), ui = units.findIndex(u => u.r === r && u.c === c && (u.alive || u.safe)), pi = pursAt(r, c);
      const isOpt = opts.some(([a, b]) => a === r && b === c);
      const cls = { h: "h", w: "w", f: "f", s: "s", ".": "" }[t];
      let tok = "";
      if (ui >= 0) tok = `<span class="tok u ${ui === sel && !over ? "sel" : ""}"><span>${units[ui].n}</span></span>`;
      else if (pi) tok = `<span class="tok p">Ж</span>`;
      const lbl = { h: "төбе", w: "өзен", f: "өткел", s: "құм", ".": "дала" }[t];
      h += `<button class="cell ${cls} ${isOpt ? "opt-move" : ""}" data-r="${r}" data-c="${c}" aria-label="${r + 1}-қатар, ${c + 1}-баған: ${lbl}${ui >= 0 ? ", жасақ " + units[ui].n : ""}${pi ? ", жазалаушы" : ""}${isOpt ? ", жүруге болады" : ""}">${tok}</button>`;
    }
    $("#escGrid", el).innerHTML = h;
    $("#escMsg", el).textContent = msg || "";
    $("#escSaved", el).textContent = units.filter(u => u.safe).length;
  }
  el.innerHTML = `<div class="mg"><div class="mg-head"><span class="stat">Құтылды: <b id="escSaved">0</b>/2</span></div>
    <p class="hint" id="escMsg"></p>
    <div class="grid7" id="escGrid"></div>
    <div class="legend"><span><i style="background:var(--saffron)"></i>Сенің жасағың</span><span><i style="background:var(--madder);border-radius:50%"></i>Жазалаушы</span><span><i style="background:#2b2b55;border:1px solid var(--sand-dim)"></i>Төбе: жазалаушы өте алмайды</span><span><i style="background:#2d4f8f"></i>Өзен: тек өткелден</span><span><i style="background:#c9a96a"></i>Құм: мақсат</span></div>
    <div class="row" id="escCtl"></div>${o.skip ? `<div class="row">${skipBtn(o)}</div>` : ""}</div>`;
  $("#escGrid", el).addEventListener("click", e => {
    const b = e.target.closest(".cell"); if (!b || over) return;
    const r = +b.dataset.r, c = +b.dataset.c;
    const ui = units.findIndex(u => u.alive && !u.safe && u.r === r && u.c === c);
    if (ui >= 0 && !moved[ui] && ui !== sel) { sel = ui; Snd.click(); paint(`Жасақ ${units[sel].n} жүреді.`); return; }
    if (sel < 0) return;
    const okMove = movesFor(units[sel]).some(([a, b2]) => a === r && b2 === c);
    if (!okMove) return;
    const u = units[sel]; u.r = r; u.c = c; Snd.hoof(1);
    if (cellT(r, c) === "s") { u.safe = true; Snd.ok(); }
    moved[sel] = true;
    const next = units.findIndex((x, i) => !moved[i] && x.alive && !x.safe);
    if (next >= 0) { sel = next; paint(`Жасақ ${units[sel].n} жүреді.`); } else endTurn();
  });
  const sk = $("[data-skip]", el); if (sk) sk.onclick = () => o.skip();
  reset();
};

MG.chrono = (el, done) => {
  let order = shuffle(CHRONO.map((_, i) => i)), t0 = 0, timer = null, checked = false, drag = null;
  const sorted = CHRONO.slice().sort((a, b) => a.y - b.y);
  const handleSVG = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  el.innerHTML = `<div class="mg"><div class="mg-head"><span class="stat">Уақыт: <b id="chT">0</b> с</span><span class="stat" id="chRes"></span></div>
    <p class="hint">Оқиғаларды ең ертесінен бастап ретке қой. Сол жақтағы тұтқадан сүйре немесе көрсеткілерді бас.</p>
    <ol class="chrono" id="chList"></ol>
    <div class="row"><button class="btn" id="chCheck">Тексеру</button><button class="btn ghost small" id="chAgain">Араластыру</button></div></div>`;
  const list = $("#chList", el);
  const startT = () => { if (!t0) { t0 = performance.now(); timer = setInterval(() => { const e = $("#chT", el); if (!e || !el.isConnected) return clearInterval(timer); e.textContent = Math.round((performance.now() - t0) / 1000); }, 250); } };
  function paint() {
    list.innerHTML = order.map((i, pos) => `<li data-i="${i}" class="${checked ? (CHRONO[i].y === sorted[pos].y ? "good" : "badp") : ""}"><button class="handle" aria-label="Сүйреу" data-h>${handleSVG}</button><span>${checked ? `<span class="yr-tag">${CHRONO[i].y}</span>` : ""}${CHRONO[i].t}</span><span class="mv"><button data-up aria-label="Жоғары жылжыту">▲</button><button data-down aria-label="Төмен жылжыту">▼</button></span></li>`).join("");
  }
  list.addEventListener("click", e => {
    const li = e.target.closest("li"); if (!li || checked) return;
    const pos = [...list.children].indexOf(li);
    if (e.target.closest("[data-up]") && pos > 0) { startT(); [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; Snd.click(); paint(); $$("li", list)[pos - 1].querySelector("[data-up]").focus(); }
    if (e.target.closest("[data-down]") && pos < order.length - 1) { startT(); [order[pos + 1], order[pos]] = [order[pos], order[pos + 1]]; Snd.click(); paint(); $$("li", list)[pos + 1].querySelector("[data-down]").focus(); }
  });
  list.addEventListener("pointerdown", e => {
    if (checked) return;
    const h = e.target.closest("[data-h]"); if (!h) return;
    const li = h.closest("li"); startT();
    drag = { li }; li.classList.add("drag"); try { h.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault();
  });
  list.addEventListener("pointermove", e => {
    if (!drag) return;
    const items = [...list.children], y = e.clientY;
    for (const it of items) {
      if (it === drag.li) continue;
      const r = it.getBoundingClientRect();
      if (y > r.top && y < r.bottom) {
        const a = items.indexOf(drag.li), b = items.indexOf(it);
        if (b < a && y < r.top + r.height / 2) list.insertBefore(drag.li, it);
        else if (b > a && y > r.top + r.height / 2) list.insertBefore(drag.li, it.nextSibling);
        break;
      }
    }
  });
  const endDrag = () => { if (!drag) return; drag.li.classList.remove("drag"); order = [...list.children].map(li => +li.dataset.i); drag = null; Snd.click(); };
  list.addEventListener("pointerup", endDrag); list.addEventListener("pointercancel", endDrag);
  $("#chCheck", el).onclick = () => {
    if (checked) return;
    checked = true; clearInterval(timer);
    const right = order.filter((i, pos) => CHRONO[i].y === sorted[pos].y).length;
    const sec = t0 ? Math.round((performance.now() - t0) / 1000) : 0;
    paint(); $("#chRes", el).textContent = `Дұрысы: ${right}/${CHRONO.length}`;
    right === CHRONO.length ? Snd.ok() : Snd.bad();
    if (right === CHRONO.length) { earn("khronolog"); setBest("chrono", sec, (a, b) => a < b); }
    done && done({ right, sec });
  };
  $("#chAgain", el).onclick = () => { order = shuffle(order); checked = false; t0 = 0; clearInterval(timer); $("#chT", el).textContent = 0; $("#chRes", el).textContent = ""; paint(); };
  paint();
};

    <div class="field"><label>Қорғау уақыты</label><div class="time-pick">${[7, 8, 10].map(m => `<button class="tab" data-m="${m}" aria-selected="${total === m * 60}">${m} минут</button>`).join("")}</div></div>
    <p class="muted">Басқару: ← → пернелері, батырмалар немесе экранды сырғыту. Шығу: Esc.</p>
    <button class="btn" id="deckStart">Слайдтарды бастау</button>`);
  $$("[data-m]").forEach(b => b.onclick = () => { total = +b.dataset.m * 60; LS.set("deckMin", +b.dataset.m); $$("[data-m]").forEach(x => x.setAttribute("aria-selected", String(x === b))); });
  $("#deckStart").onclick = () => openDeck(slides, total);
}
function openDeck(slides, total) {
  let si = 0, t0 = performance.now(), elapsed = 0, paused = false;
  const d = document.createElement("div"); d.className = "deck"; d.id = "deck"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Қорғау слайдтары");
  d.innerHTML = `<div class="deck-top"><span class="deck-time" id="dkTime"></span><span class="deck-prog"><i id="dkProg"></i></span><div class="row"><button class="tbtn" id="dkPause">Кідірту</button><button class="tbtn" id="dkFull">Толық экран</button><button class="tbtn" id="dkClose">Шығу</button></div></div>
    <div id="dkSlide" style="display:grid;min-height:0;overflow:auto"></div>
    <div class="deck-bot"><button class="btn ghost small" id="dkPrev">Артқа</button><div class="dots" id="dkDots"></div><button class="btn small" id="dkNext">Алға</button></div>`;
  document.body.appendChild(d); document.body.style.overflow = "hidden";
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const upd = () => { const e = paused ? elapsed : elapsed + (performance.now() - t0) / 1000; const left = total - e; const tm = $("#dkTime"); if (!tm) return; tm.textContent = (left < 0 ? "+" : "") + fmt(Math.abs(left)); tm.classList.toggle("warn", left < 60); $("#dkProg").style.setProperty("--p", Math.min(1, e / total)); };
  const tick = setInterval(upd, 500); upd();
  const show = (dir = 1) => {
    const box = $("#dkSlide");
    box.innerHTML = `<div class="slide ${dir < 0 ? "back" : ""}">${slides[si]()}</div>`;
    $$("[data-qr]", box).forEach(q => { const c = qrCanvas(siteUrl(), 400); if (c) q.appendChild(c); });
    $("#dkDots").innerHTML = slides.map((_, i) => `<i class="${i <= si ? "on" : ""}"></i>`).join("");
    $("#dkPrev").disabled = si === 0; $("#dkNext").textContent = si === slides.length - 1 ? "Аяқтау" : "Алға";
  };
  const next = () => { if (si < slides.length - 1) { si++; show(1); Snd.click(); } else close(); };
  const prev = () => { if (si > 0) { si--; show(-1); Snd.click(); } };
  function close() { clearInterval(tick); document.removeEventListener("keydown", key); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} d.remove(); document.body.style.overflow = ""; }
  function key(e) { if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); next(); } else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); } else if (e.key === "Escape") close(); }
  document.addEventListener("keydown", key);
  $("#dkNext").onclick = next; $("#dkPrev").onclick = prev; $("#dkClose").onclick = close;
  $("#dkPause").onclick = () => { if (paused) { t0 = performance.now(); paused = false; $("#dkPause").textContent = "Кідірту"; } else { elapsed += (performance.now() - t0) / 1000; paused = true; $("#dkPause").textContent = "Жалғастыру"; } upd(); };
  $("#dkFull").onclick = () => { try { const p = d.requestFullscreen && d.requestFullscreen(); if (p && p.catch) p.catch(() => toast("Толық экран", "Бұл жерде толық экран қол жетімсіз.")); } catch (e) {} };
  let sx = null;
  d.addEventListener("pointerdown", e => { sx = e.clientX; });
  d.addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx; if (Math.abs(dx) > 60 && !e.target.closest("button")) dx < 0 ? next() : prev(); sx = null; });
  show(); $("#dkNext").focus();
}

/* ===================== ROUTER & CHROME ===================== */
const VIEWS = { oiyndar: vHub, bilim: vBilim, zertteu: vZertteu, reiting: vReiting, qr: vQR, qorgau: vQorgau };
function route() {
  hideTip();
  const h = (location.hash || "").replace(/^#/, "");
  const v = VIEWS[h] ? h : "";
  if (v !== view && v !== "oiyndar") hubSel = null;
  view = v; renderNav(); renderHud();
  if (v === "") { Sky.mood(SCENE_MOOD[S.scene] || "night"); try { SCENES[S.scene](); } catch (e) { S.scene = 0; SCENES[0](); } }
  else { Sky.mood("night"); try { VIEWS[v](); } catch (e) { stage.innerHTML = panel(`<h2>Қате шықты</h2><p>Бетті қайта ашып көріңіз.</p>`); } }
  afterRender(); window.scrollTo({ top: 0, behavior: "auto" });
}
window.addEventListener("hashchange", route);

const sndBtn = $("#sndBtn");
function setSound(on) {
  prefs.sound = on; applyPrefs();
  if (on) { if (!Snd.start()) { toast("Дыбыс", "Бұл құрылғыда дыбыс қосылмады."); prefs.sound = false; applyPrefs(); } }
  else Snd.stop();
  sndBtn.setAttribute("aria-pressed", String(Snd.on));
}
sndBtn.onclick = () => setSound(!Snd.on);
if (prefs.sound) { const once = e => { if (e.target.closest && e.target.closest("#sndBtn")) return; document.removeEventListener("pointerdown", once, true); document.removeEventListener("keydown", once, true); if (!Snd.on) setSound(true); }; document.addEventListener("pointerdown", once, true); document.addEventListener("keydown", once, true); }
const setBtn = $("#setBtn"), setPop = $("#settings");
setBtn.onclick = () => { const open = setPop.hidden; setPop.hidden = !open; setBtn.setAttribute("aria-expanded", String(open)); };
document.addEventListener("click", e => { if (!setPop.hidden && !e.target.closest("#settings") && !e.target.closest("#setBtn")) { setPop.hidden = true; setBtn.setAttribute("aria-expanded", "false"); } });
$("#optMusic").checked = prefs.music; $("#optSfx").checked = prefs.sfx; $("#optBig").checked = prefs.big; $("#optCalm").checked = prefs.calm;
$("#optMusic").onchange = e => { prefs.music = e.target.checked; applyPrefs(); Snd.applyPrefs(); if (prefs.music && !Snd.on) setSound(true); };
$("#optSfx").onchange = e => { prefs.sfx = e.target.checked; applyPrefs(); Snd.applyPrefs(); };
$("#optBig").onchange = e => { prefs.big = e.target.checked; applyPrefs(); };
$("#optCalm").onchange = e => { prefs.calm = e.target.checked; applyPrefs(); Sky.restart(); };
$("#optReset").onclick = () => { S = fresh(); LS.del("save"); LS.del("best"); LS.del("badges"); badges = new Set(); for (const k in best) delete best[k]; toast("Тазаланды", "Ойын басынан басталады."); setPop.hidden = true; if (view === "") go(0); else route(); };
$("#polaris").onclick = () => { earn("zhuldyzshy"); toast("Темірқазық", "Қазақтар Темірқазықты аспанның темір қазығы деп атаған. Аңыз бойынша оған Ақбозат пен Көкбозат деген екі ат байланған, ал Жетіқарақшы оларды ұрламақ болып, түні бойы айналады. Жолаушылар бағытты осы жұлдызбен тапқан.", 9000); };

function start(data) {
  if (data && typeof data.scene === "number" && data.m) S = Object.assign(fresh(), data);
  route();
}
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data);
})();
</script>
